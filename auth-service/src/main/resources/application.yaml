server:
  port: 8081
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db
    username: azki_app
    password: app_password
  flyway:
    user: azki_migration
    password: migration_password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
jwt:
  secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_MIN_256_BITS_LONG_SECRET_KEY}
  expiration-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.azki.auth: DEBUG