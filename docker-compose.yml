networks:
  azki-net:
    driver: bridge

volumes:
  mysql-data:
  nexus-data:

services:
  mysql:
    image: mysql:8.0
    container_name: azki-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/docker/mysql-init:/docker-entrypoint-initdb.d
    networks:
      - azki-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: azki-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - azki-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  nexus:
    image: sonatype/nexus3:3.94.1
    container_name: azki-nexus
    restart: unless-stopped
    ports:
      - "8085:8081"
    volumes:
      - nexus-data:/nexus-data
    networks:
      - azki-net
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms1200m -Xmx1200m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/service/rest/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s